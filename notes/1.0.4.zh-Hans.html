<h3>新增</h3>
<ul><li>集合可以设置颜色，库中属于集合的卡片头部显示该颜色</li><li>库和剪贴板中的文字、富文本、链接、颜色可以修改内容</li><li>「库」菜单可以新建集合</li><li>库中可以新建文本，入口在「库」菜单和管理窗口工具栏</li></ul>
<h3>改进</h3>
<ul><li>库中的卡片不再显示来源 App 图标</li><li>钉住到库的内容按加入库的时间排序，卡片显示加入时间</li><li>重命名后卡片头部显示新名称</li></ul>
<h3>修复</h3>
<ul><li>开启获取链接标题之前的链接，粘贴或钉住后不再联网获取</li></ul>
